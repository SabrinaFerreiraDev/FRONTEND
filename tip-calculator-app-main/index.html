<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main class="app">
      <h1 class="app-title">SPLI <br>TTER</h1>
      <div class="container">
        <section class="form-section">
          <div class="input-group">
            <label for="Bill" class="label">Bill</label>
            <span>
                <img src="./src/img/icon-dollar.svg" alt="icon-dollar" class="icon">
            <input
              class="input"
              type="number"
              step="0.01"
              min="0"

              
              id="Bill"
              name="Bill"
            />
        </span>
            
          </div>

          <div class="tip-selector">
            <label for="Tip" class="label">Select Tip %</label>

            <div class="tip-buttons">
              <button class="tip-btn " value="5">5%</button>
              <button class="tip-btn" value="10">10%</button>
              <button class="tip-btn" value="15">15%</button>
              <button class="tip-btn" value="25">25%</button>
              <button class="tip-btn" value="50">50%</button>

              <input
                class="tip-custom"
                type="text"
                placeholder="Custom"
                id="Custom"
                name="Custom"
              />
            </div>
          </div>

          <div class="input-group">
          
            <div class="group-people">  
              <label for="People" class="label">Number of People</label>
              <p class="error">can't be zero</p>

            </div>
            <span>
                <img src="./src/img/icon-person.svg" alt="icon-person" class="icon">  
                    <input
              class="input"
              type="number"
              min="1"                      
              id="People"
              name="People"
            />
            </span>
      
          </div>
        </section>

        <section class="result-section">
          <div class="result-card">
            <div class="result-label">
              <span>Tip Amount</span>
              <span class="result-sub">/ person</span>
            </div>

            <div class="result-value">
              <span class="sigla">$</span>
              <span id="TipAmount">0.00</span>
            </div>
          </div>

          <div class="result-card">
            <div class="result-label">
              <span>Total</span>
              <span class="result-sub">/ person</span>
            </div>

            <div class="result-value">
              <span class="sigla">$</span>
              <span id="TotalAmount">0.00</span>
            </div>
          </div>

          <div class="reset-container">
            <button class="reset-btn">RESET</button>
          </div>
        </section>
      </div>
    </main>
    <footer>
      <div class="attribution">
  Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
  Coded by <a href="#">Sabrina Ferreira</a>.
</div>
    </footer>
    <script src="./src//javascript/script.js"></script>
  </body>
</html>
